# Experiment settings taken from the accepted manuscript (Chapter 3).
seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  harmonized_dir: data/harmonized
  # Each dataset: where it lives, its Kaggle slug, and rules that label files by
  # their folder path (glob on the path relative to `path`, first match wins).
  # Checked against the real downloads with `python scripts/inspect_datasets.py`.
  datasets:
    kannan_ai_human_art:          # labeled train split only: 10,330 AI / 8,288 human; test/ is unlabeled
      path: data/raw/kannan
      kaggle: kausthubkannan/ai-and-human-art-classification
      classes:
        - {match: "*NON_AI*", label: 0}
        - {match: "*AI_GENERATED*", label: 1}
    superpotato9_ai_recognition:  # 21.6k, imbalanced, original sizes
      path: data/raw/superpotato9
      kaggle: superpotato9/dalle-recognition-dataset
      classes:
        - {match: "*real*", label: 0}
        - {match: "*fake*", label: 1}
    ai_artbench:                  # 180k+, 60k human (ArtBench-10)
      path: data/raw/ai_artbench
      kaggle: ravidussilva/real-ai-art
      classes:
        - {match: "*/AI_*", label: 1}   # style folders like AI_SD_baroque; the root folder name also contains "AI_"
        - {match: "*", label: 0}
  samples_per_class: 10000
  balance_sources: true    # split each class's quota evenly across datasets
  split: {train: 0.70, val: 0.15, test: 0.15}
  cv_folds: 5
  labels: {human: 0, ai: 1}

preprocess:
  # One-time step before training: every sampled image is resized/center-cropped
  # to `size` and re-saved as JPEG at `jpeg_quality`, so class and dataset can't
  # be told apart by file format or resolution (Superpotato9 AI is mostly PNG,
  # its human images JPEG; AI-ArtBench human is 256 px, its AI 256 or 768 px).
  harmonize: {enabled: true, size: 256, jpeg_quality: 95}
  image_size: 224
  # Training-split RGB statistics from scripts/eda.py on the harmonized images
  # (2,000 sampled train images).
  mean: [0.4827, 0.4395, 0.3883]
  std: [0.2823, 0.2705, 0.2714]

augment:
  rotation_deg: 15
  hflip: true
  brightness: 0.2
  contrast: 0.2
  color_jitter: true

transforms:
  jpeg_qualities: [90, 70, 50, 30]
  webp_qualities: [80]
  resize_scales: [0.5, 0.25]
  recompression_cycles: [3]
  recompression_quality: 75

watermark:
  alpha: 4.0          # embedding strength on 0-255 pixel scale; tune for invisibility vs durability
  alphas: [2.0, 4.0, 8.0]   # strengths compared by scripts/watermark_test.py (PSNR ~42 / 36 / 30 dB)
  key: 1234           # seed for the pseudo-random pattern W
  target_fpr: 0.01    # threshold is set so at most 1% of unmarked validation images trigger it
  threshold: 0.05     # fallback only; watermark_test.py writes the calibrated one to outputs/watermark/threshold.json

provenance:
  # Every test image is signed with a test CA: AI images declare the IPTC digital
  # source type below, human images the human one (best case: universal adoption).
  ai_source_type: trainedAlgorithmicMedia
  human_source_type: digitalCreation   # made by a person with digital tools
  softbinding_target_fpr: 0.01         # fingerprint lookup may wrongly match at most 1% of unregistered images

model:
  architectures: [resnet50, efficientnet_b0]
  baseline: resnet18
  pretrained: true
  dropout: 0.5

train:
  optimizer: adam
  lr: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 32
  epochs: 50
  patience: 5         # stop when val loss hasn't improved for this many epochs
  num_workers: 2      # Colab has 2 CPU cores

fusion:
  # Sequential fallback: provenance -> watermark -> calibrated CNN.
  abstain_low: 0.35   # CNN probability band [low, high] maps to "uncertain"
  abstain_high: 0.65

evaluation:
  significance_alpha: 0.05
  ece_bins: 15
